<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="app.title"></title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <header>
      <h1 data-i18n="app.title"></h1>
      <label class="language-picker">
        <span data-i18n="language.label"></span>
        <select id="language">
          <option value="ru">RU</option>
          <option value="uz">UZ</option>
        </select>
      </label>
    </header>
    <main>
      <p id="message" role="status" aria-live="polite"></p>
      <section id="login-view">
        <h2 data-i18n="login.title"></h2>
        <form id="login-form">
          <label><span data-i18n="login.login"></span><input name="login" autocomplete="username" required></label>
          <label><span data-i18n="login.password"></span><input name="password" type="password" autocomplete="current-password" required></label>
          <button type="submit" data-i18n="login.submit"></button>
        </form>
      </section>
      <section id="app-view" hidden>
        <div class="session-bar">
          <span id="current-user"></span>
          <button id="logout" type="button" data-i18n="auth.logout"></button>
        </div>
        <nav id="navigation">
          <button type="button" data-page="sales" data-i18n="nav.sales"></button>
          <button type="button" data-page="print" data-i18n="nav.print" hidden></button>
          <button type="button" data-page="products" data-i18n="nav.products"></button>
          <button type="button" data-page="stock" data-i18n="nav.stock"></button>
          <button type="button" data-page="purchases" data-i18n="nav.purchases"></button>
          <button type="button" data-page="movements" data-i18n="nav.movements"></button>
          <button type="button" data-page="debts" data-i18n="nav.debts" hidden></button>
          <button type="button" data-page="cash" data-i18n="nav.cash" hidden></button>
          <button type="button" data-page="users" data-i18n="nav.users"></button>
          <button type="button" data-page="connection" data-i18n="nav.connection" hidden></button>
        </nav>
        <section id="sales-page" class="page" hidden>
          <h2 data-i18n="sales.title"></h2>
          <div id="sales-warehouse-config" hidden>
            <label>
              <span data-i18n="sales.default_warehouse"></span>
              <select id="sales-default-warehouse"></select>
            </label>
            <button id="save-default-warehouse" type="button" data-i18n="sales.save_default_warehouse"></button>
          </div>
          <p id="sales-warehouse-status" role="status"></p>
          <label>
            <span data-i18n="sales.search"></span>
            <input id="sales-search" type="search" autocomplete="off">
          </label>
          <div id="sales-search-results" class="sales-results"></div>
          <form id="sales-checkout">
            <label>
              <span data-i18n="sales.customer"></span>
              <select id="sales-customer"></select>
            </label>
            <label>
              <span data-i18n="sales.receipt_language"></span>
              <select id="sales-receipt-language">
                <option value="ru">RU</option>
                <option value="uz">UZ</option>
              </select>
            </label>
            <h3 data-i18n="sales.cart"></h3>
            <div class="table-wrap">
              <table><thead id="sales-cart-head"></thead><tbody id="sales-cart-body"></tbody></table>
            </div>
            <div id="sales-check-discount">
              <label>
                <span data-i18n="sales.check_discount"></span>
                <select id="sales-check-discount-kind">
                  <option value="percent" data-i18n="sales.discount_percent"></option>
                  <option value="amount" data-i18n="sales.discount_amount"></option>
                </select>
                <input id="sales-check-discount-value" type="text" inputmode="decimal">
              </label>
            </div>
            <h3 data-i18n="sales.payments"></h3>
            <div id="sales-payments" class="sales-payments"></div>
            <p id="sales-summary" aria-live="polite"></p>
            <button id="sales-submit" type="submit" data-i18n="sales.submit"></button>
          </form>
          <section id="sales-receipt" hidden>
            <h3 data-i18n="sales.receipt"></h3>
            <p id="sales-receipt-summary"></p>
          </section>
        </section>
        <section id="print-page" class="page" hidden>
          <h2 data-i18n="print.title"></h2>
          <label class="print-language-picker">
            <span data-i18n="print.copy_language"></span>
            <select id="print-copy-language"><option value="ru">RU</option><option value="uz">UZ</option></select>
          </label>
          <button id="print-refresh" type="button" data-i18n="print.refresh"></button>
          <p id="print-queue-note" role="status" aria-live="polite"></p>
          <div class="table-wrap">
            <table><thead id="print-jobs-head"></thead><tbody id="print-jobs-body"></tbody></table>
          </div>
          <form id="print-profile-form" class="form-grid" hidden>
            <h3 data-i18n="print.profile"></h3>
            <label><span data-i18n="print.store_name"></span><input name="storeName" maxlength="120" required></label>
            <label><span data-i18n="print.address"></span><input name="address" maxlength="200"></label>
            <label><span data-i18n="print.phone"></span><input name="phone" maxlength="40"></label>
            <label><span data-i18n="print.footer_ru"></span><textarea name="footerRu" maxlength="500" rows="3"></textarea></label>
            <label><span data-i18n="print.footer_uz"></span><textarea name="footerUz" maxlength="500" rows="3"></textarea></label>
            <button type="submit" data-i18n="print.save_profile"></button>
          </form>
        </section>
        <section id="debts-page" class="page" hidden>
          <h2 data-i18n="debts.title"></h2>
          <div class="table-wrap">
            <table><thead id="debtors-head"></thead><tbody id="debtors-body"></tbody></table>
          </div>
          <label>
            <span data-i18n="debts.customer"></span>
            <select id="debt-customer-select"></select>
          </label>
          <p id="debt-customer-balance" role="status"></p>
          <div class="table-wrap">
            <table><thead id="debts-sales-head"></thead><tbody id="debts-sales-body"></tbody></table>
          </div>
          <form id="debt-payment-form" class="form-grid" hidden>
            <label>
              <span data-i18n="debts.payment_method"></span>
              <select id="debt-payment-method" required></select>
            </label>
            <label>
              <span data-i18n="debts.payment_amount"></span>
              <input id="debt-payment-amount" type="text" inputmode="decimal" required>
            </label>
            <button type="submit" data-i18n="debts.collect"></button>
          </form>
          <form id="debt-forgiveness-form" hidden>
            <h3 data-i18n="debts.forgive"></h3>
            <label>
              <span data-i18n="debts.reason"></span>
              <input id="debt-forgiveness-reason" maxlength="1000" required>
            </label>
            <p data-i18n="debts.forgive_hint"></p>
            <button type="submit" data-i18n="debts.forgive_submit"></button>
          </form>
        </section>
        <section id="cash-page" class="page" hidden>
          <h2 data-i18n="cash.title"></h2>
          <p><span data-i18n="cash.balance"></span>: <strong id="cash-balance"></strong></p>
          <form id="cash-operation-form" class="form-grid" hidden>
            <label>
              <span data-i18n="cash.operation_type"></span>
              <select id="cash-operation-type" required>
                <option value="cash_in" data-i18n="cash.type.cash_in"></option>
                <option value="cash_out" data-i18n="cash.type.cash_out"></option>
                <option value="expense" data-i18n="cash.type.expense"></option>
                <option value="collection" data-i18n="cash.type.collection"></option>
              </select>
            </label>
            <label>
              <span data-i18n="cash.amount"></span>
              <input id="cash-operation-amount" type="text" inputmode="decimal" required>
            </label>
            <label id="cash-category-field">
              <span data-i18n="cash.category"></span>
              <input id="cash-operation-category" maxlength="120">
            </label>
            <label>
              <span data-i18n="cash.reason"></span>
              <input id="cash-operation-reason" maxlength="500" required>
            </label>
            <label>
              <span data-i18n="cash.reference"></span>
              <input id="cash-operation-reference" maxlength="200">
            </label>
            <button type="submit" data-i18n="cash.create"></button>
          </form>
          <div class="filter-grid">
            <label><span data-i18n="cash.from"></span><input id="cash-from" type="date"></label>
            <label><span data-i18n="cash.to"></span><input id="cash-to" type="date"></label>
            <button id="cash-refresh" type="button" data-i18n="cash.refresh"></button>
          </div>
          <p><span data-i18n="cash.period_balance"></span>: <strong id="cash-period-balance"></strong></p>
          <h3 data-i18n="cash.noncash"></h3>
          <div class="table-wrap">
            <table><thead id="cash-noncash-head"></thead><tbody id="cash-noncash-body"></tbody></table>
          </div>
          <h3 data-i18n="cash.history"></h3>
          <div class="table-wrap">
            <table><thead id="cash-entries-head"></thead><tbody id="cash-entries-body"></tbody></table>
          </div>
          <div class="pagination-controls">
            <button id="cash-previous" type="button" data-i18n="movements.previous"></button>
            <button id="cash-next" type="button" data-i18n="movements.next"></button>
          </div>
        </section>
        <section id="products-page" class="page">
          <h2 data-i18n="products.title"></h2>
          <form id="product-form" class="form-grid">
            <label><span data-i18n="products.sku"></span><input name="sku" required></label>
            <label><span data-i18n="products.name"></span><input name="name" required></label>
            <label>
              <span data-i18n="products.unit"></span>
              <select id="product-unit-select" name="unit" required></select>
            </label>
            <label id="custom-unit-field" hidden>
              <span data-i18n="products.custom_unit"></span>
              <input name="custom_unit" maxlength="32">
            </label>
            <label><span data-i18n="products.base_price"></span><input name="base_price" type="number" min="0" step="1" required></label>
            <button type="submit" data-i18n="products.create"></button>
          </form>
          <div class="table-wrap"><table><thead id="products-head"></thead><tbody id="products-body"></tbody></table></div>
        </section>
        <section id="stock-page" class="page" hidden>
          <h2 data-i18n="stock.title"></h2>
          <label><span data-i18n="stock.warehouse"></span><select id="stock-warehouse-filter"></select></label>
          <div class="table-wrap"><table><thead id="stock-head"></thead><tbody id="stock-body"></tbody></table></div>
        </section>
        <section id="purchases-page" class="page" hidden>
          <h2 data-i18n="purchases.title"></h2>
          <form id="purchase-form">
            <label><span data-i18n="purchases.warehouse"></span><select name="warehouseId" id="purchase-warehouse" required></select></label>
            <label><span data-i18n="purchases.date"></span><input name="date" type="date" required></label>
            <label><span data-i18n="purchases.supplier"></span><input name="supplier" maxlength="200"></label>
            <div>
              <h3 data-i18n="purchases.lines"></h3>
              <div id="purchase-lines" class="purchase-lines"></div>
              <button id="add-purchase-line" type="button" data-i18n="purchases.add_line"></button>
            </div>
            <label><span data-i18n="purchases.note"></span><input name="note" maxlength="1000"></label>
            <button type="submit" data-i18n="purchases.submit"></button>
          </form>
          <h3 data-i18n="purchases.history"></h3>
          <div class="table-wrap"><table><thead id="purchases-head"></thead><tbody id="purchases-body"></tbody></table></div>
          <section id="purchase-detail" hidden>
            <h3 id="purchase-detail-title"></h3>
            <div class="table-wrap"><table><thead id="purchase-detail-head"></thead><tbody id="purchase-detail-body"></tbody></table></div>
          </section>
        </section>
        <section id="movements-page" class="page" hidden>
          <h2 data-i18n="movements.title"></h2>
          <div class="filter-grid">
            <label><span data-i18n="movements.product"></span><select id="movement-product-filter"></select></label>
            <label><span data-i18n="movements.warehouse"></span><select id="movement-warehouse-filter"></select></label>
            <button id="refresh-movements" type="button" data-i18n="movements.refresh"></button>
          </div>
          <div class="table-wrap"><table><thead id="movements-head"></thead><tbody id="movements-body"></tbody></table></div>
          <div class="pagination-controls">
            <button id="movements-previous" type="button" data-i18n="movements.previous"></button>
            <button id="movements-next" type="button" data-i18n="movements.next"></button>
          </div>
        </section>
        <section id="users-page" class="page" hidden>
          <h2 data-i18n="users.title"></h2>
          <form id="user-form" class="form-grid">
            <label><span data-i18n="users.login"></span><input name="login" autocomplete="off" required></label>
            <label><span data-i18n="users.full_name"></span><input name="fullName" required></label>
            <label><span data-i18n="users.password"></span><input name="password" type="password" autocomplete="new-password" minlength="5" required></label>
            <label><span data-i18n="users.role"></span><select name="role"><option value="cashier" data-i18n="users.cashier"></option><option value="admin" data-i18n="users.admin"></option></select></label>
            <label><span data-i18n="users.language"></span><select name="lang"><option value="ru">RU</option><option value="uz">UZ</option></select></label>
            <button type="submit" data-i18n="users.create"></button>
          </form>
          <div class="table-wrap"><table><thead id="users-head"></thead><tbody id="users-body"></tbody></table></div>
          <form id="user-edit-form" class="form-grid" hidden>
            <h3 data-i18n="users.edit"></h3>
            <label><span data-i18n="users.full_name"></span><input name="fullName" required></label>
            <label><span data-i18n="users.role"></span><select name="role"><option value="cashier" data-i18n="users.cashier"></option><option value="admin" data-i18n="users.admin"></option></select></label>
            <label><span data-i18n="users.language"></span><select name="lang"><option value="ru">RU</option><option value="uz">UZ</option></select></label>
            <label class="permission-item"><input name="active" type="checkbox"><span data-i18n="users.active"></span></label>
            <label><span data-i18n="users.new_password"></span><input name="password" type="password" autocomplete="new-password" minlength="5"></label>
            <button type="submit" data-i18n="users.save_user"></button>
          </form>
          <section id="permission-editor" hidden>
            <h3 data-i18n="users.permissions"></h3>
            <p id="permission-user"></p>
            <div id="permission-list" class="permission-grid"></div>
            <button id="save-permissions" type="button" data-i18n="users.save_permissions"></button>
          </section>
        </section>
        <section id="connection-page" class="page" hidden>
          <h2 data-i18n="connection.title"></h2>
          <p data-i18n="connection.description"></p>
          <button id="refresh-connection-info" type="button" data-i18n="connection.refresh"></button>
          <p id="connection-warning" role="status" aria-live="polite"></p>
          <div id="connection-addresses"></div>
        </section>
      </section>
    </main>
  </body>
</html>
