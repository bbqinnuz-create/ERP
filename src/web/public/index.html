<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="app.title"></title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <header>
      <h1 data-i18n="app.title"></h1>
      <label class="language-picker">
        <span data-i18n="language.label"></span>
        <select id="language">
          <option value="ru">RU</option>
          <option value="uz">UZ</option>
        </select>
      </label>
      <span id="server-indicator" class="server-indicator" data-state="checking" role="status" aria-live="polite">
        <span class="server-indicator-dot" aria-hidden="true"></span>
        <span id="server-indicator-label" data-i18n="server.checking"></span>
      </span>
    </header>
    <main>
      <p id="message" role="status" aria-live="polite"></p>
      <section id="login-view">
        <h2 data-i18n="login.title"></h2>
        <form id="login-form">
          <label><span data-i18n="login.login"></span><input name="login" autocomplete="username" required></label>
          <label><span data-i18n="login.password"></span><input name="password" type="password" autocomplete="current-password" required></label>
          <button type="submit" data-i18n="login.submit"></button>
        </form>
      </section>
      <section id="app-view" hidden>
        <div class="session-bar">
          <button id="navigation-toggle" type="button" aria-expanded="false" aria-controls="navigation-menu">
            <span id="navigation-toggle-label" data-i18n="nav.pages"></span>
          </button>
          <span id="current-user"></span>
        </div>
        <nav id="navigation">
          <div id="navigation-menu" hidden>
            <a href="/sell" data-page="sales" data-i18n="nav.sales"></a>
            <a href="/held-carts" data-page="heldCarts" data-i18n="nav.held_carts" hidden></a>
            <a href="/reservations" data-page="reservations" data-i18n="nav.reservations" hidden></a>
            <a href="/print" data-page="print" data-i18n="nav.print" hidden></a>
            <a href="/returns" data-page="returns" data-i18n="nav.returns" hidden></a>
            <a href="/writeoffs" data-page="writeoffs" data-i18n="nav.writeoffs" hidden></a>
            <a href="/stocktakes" data-page="stocktakes" data-i18n="nav.stocktakes" hidden></a>
            <a href="/reports" data-page="reports" data-i18n="nav.reports" hidden></a>
            <a href="/products" data-page="products" data-i18n="nav.products"></a>
            <a href="/stock" data-page="stock" data-i18n="nav.stock"></a>
            <a href="/warehouses" data-page="warehouses" data-i18n="nav.warehouses" hidden></a>
            <a href="/purchases" data-page="purchases" data-i18n="nav.purchases"></a>
            <a href="/movements" data-page="movements" data-i18n="nav.movements"></a>
            <a href="/debts" data-page="debts" data-i18n="nav.debts" hidden></a>
            <a href="/cash" data-page="cash" data-i18n="nav.cash" hidden></a>
            <a href="/users" data-page="users" data-i18n="nav.users"></a>
            <a href="/connection" data-page="connection" data-i18n="nav.connection" hidden></a>
            <button id="logout" class="navigation-logout" type="button" data-i18n="auth.logout"></button>
          </div>
        </nav>
        <section id="sales-page" class="page" hidden>
          <h2 data-i18n="sales.title"></h2>
          <div class="sales-page-links">
            <a id="sales-held-carts-link" class="button-link" href="/held-carts" data-page="heldCarts"
              data-i18n="nav.held_carts" hidden></a>
            <a id="sales-reservations-link" class="button-link" href="/reservations" data-page="reservations"
              data-i18n="nav.reservations" hidden></a>
          </div>
          <div id="sales-warehouse-config" hidden>
            <label>
              <span data-i18n="sales.default_warehouse"></span>
              <select id="sales-default-warehouse"></select>
            </label>
            <button id="save-default-warehouse" type="button" data-i18n="sales.save_default_warehouse"></button>
            <label>
              <span data-i18n="sales.counter_reservation_hours"></span>
              <select id="counter-reservation-hours">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
              </select>
            </label>
            <button id="save-counter-reservation-hours" type="button"
              data-i18n="sales.save_counter_reservation_hours"></button>
          </div>
          <p id="sales-warehouse-status" role="status"></p>
          <label id="sales-warehouse-choice-field" hidden>
            <span data-i18n="sales.choose_warehouse"></span>
            <select id="sales-warehouse-choice"></select>
          </label>
          <label>
            <span data-i18n="sales.search"></span>
            <input id="sales-search" type="search" autocomplete="off">
          </label>
          <div id="sales-search-results" class="sales-results">
            <div class="sales-product sales-product-header" aria-hidden="true">
              <span data-i18n="sales.product_name"></span>
              <span data-i18n="sales.available_stock"></span>
              <span data-i18n="sales.product_price"></span>
              <span></span>
              <span></span>
            </div>
          </div>
          <form id="sales-checkout">
            <h3 data-i18n="sales.cart"></h3>
            <div class="table-wrap">
              <table><thead id="sales-cart-head"></thead><tbody id="sales-cart-body"></tbody></table>
            </div>
            <div id="sales-check-discount">
              <label>
                <span data-i18n="sales.check_discount"></span>
                <select id="sales-check-discount-kind">
                  <option value="percent" data-i18n="sales.discount_percent"></option>
                  <option value="amount" data-i18n="sales.discount_amount"></option>
                </select>
                <input id="sales-check-discount-value" type="text" inputmode="decimal">
              </label>
            </div>
            <button id="sales-submit" type="button" data-i18n="sales.submit"></button>
            <label>
              <span data-i18n="sales.customer"></span>
              <select id="sales-customer"></select>
            </label>
            <div class="sales-cart-actions">
              <button id="sales-hold-cart" type="button" data-i18n="held.hold"></button>
              <button id="sales-reserve-cart" type="button" data-i18n="held.reserve"></button>
            </div>
          </form>
          <dialog id="sales-payment-dialog" class="modal-dialog sales-payment-dialog">
            <form id="sales-payment-form">
              <h2 data-i18n="sales.payments"></h2>
              <div id="sales-payments" class="sales-payments"></div>
              <p id="sales-summary" aria-live="polite"></p>
              <div class="dialog-actions">
                <button id="sales-payment-cancel" class="button-secondary" type="button"
                  data-i18n="common.cancel"></button>
                <button id="sales-confirm-payment" type="submit" data-i18n="sales.confirm_payment"></button>
              </div>
            </form>
          </dialog>
          <section id="sales-receipt" hidden>
            <h3 data-i18n="sales.receipt"></h3>
            <p id="sales-receipt-summary"></p>
          </section>
        </section>
        <section id="heldCarts-page" class="page" hidden>
          <h2 data-i18n="held.title"></h2>
          <h3 data-i18n="counter_orders.title"></h3>
          <div id="counter-orders-list"></div>
          <h3 data-i18n="held.carts_title"></h3>
          <div id="held-carts-list"></div>
        </section>
        <section id="reservations-page" class="page" hidden>
          <h2 data-i18n="reservations.title"></h2>
          <div class="table-wrap">
            <table><thead id="reservations-head"></thead><tbody id="reservations-body"></tbody></table>
          </div>
        </section>
        <section id="print-page" class="page" hidden>
          <h2 data-i18n="print.title"></h2>
          <label class="print-language-picker">
            <span data-i18n="print.copy_language"></span>
            <select id="print-copy-language"><option value="ru">RU</option><option value="uz">UZ</option></select>
          </label>
          <button id="print-refresh" type="button" data-i18n="print.refresh"></button>
          <p id="print-queue-note" role="status" aria-live="polite"></p>
          <div class="table-wrap">
            <table><thead id="print-jobs-head"></thead><tbody id="print-jobs-body"></tbody></table>
          </div>
          <form id="print-profile-form" class="form-grid" hidden>
            <h3 data-i18n="print.profile"></h3>
            <label><span data-i18n="print.store_name"></span><input name="storeName" maxlength="120" required></label>
            <label><span data-i18n="print.address"></span><input name="address" maxlength="200"></label>
            <label><span data-i18n="print.phone"></span><input name="phone" maxlength="40"></label>
            <label><span data-i18n="print.footer_ru"></span><textarea name="footerRu" maxlength="500" rows="3"></textarea></label>
            <label><span data-i18n="print.footer_uz"></span><textarea name="footerUz" maxlength="500" rows="3"></textarea></label>
            <button type="submit" data-i18n="print.save_profile"></button>
          </form>
        </section>
        <section id="debts-page" class="page" hidden>
          <h2 data-i18n="debts.title"></h2>
          <div class="table-wrap">
            <table><thead id="debtors-head"></thead><tbody id="debtors-body"></tbody></table>
          </div>
          <label>
            <span data-i18n="debts.customer"></span>
            <select id="debt-customer-select"></select>
          </label>
          <p id="debt-customer-balance" role="status"></p>
          <div class="table-wrap">
            <table><thead id="debts-sales-head"></thead><tbody id="debts-sales-body"></tbody></table>
          </div>
          <form id="debt-payment-form" class="form-grid" hidden>
            <label>
              <span data-i18n="debts.payment_method"></span>
              <select id="debt-payment-method" required></select>
            </label>
            <label>
              <span data-i18n="debts.payment_amount"></span>
              <input id="debt-payment-amount" type="text" inputmode="decimal" required>
            </label>
            <button type="submit" data-i18n="debts.collect"></button>
          </form>
          <form id="debt-forgiveness-form" hidden>
            <h3 data-i18n="debts.forgive"></h3>
            <label>
              <span data-i18n="debts.reason"></span>
              <input id="debt-forgiveness-reason" maxlength="1000" required>
            </label>
            <p data-i18n="debts.forgive_hint"></p>
            <button type="submit" data-i18n="debts.forgive_submit"></button>
          </form>
        </section>
        <section id="cash-page" class="page" hidden>
          <h2 data-i18n="cash.title"></h2>
          <p><span data-i18n="cash.balance"></span>: <strong id="cash-balance"></strong></p>
          <form id="cash-operation-form" class="form-grid" hidden>
            <label>
              <span data-i18n="cash.operation_type"></span>
              <select id="cash-operation-type" required>
                <option value="cash_in" data-i18n="cash.type.cash_in"></option>
                <option value="cash_out" data-i18n="cash.type.cash_out"></option>
                <option value="expense" data-i18n="cash.type.expense"></option>
                <option value="collection" data-i18n="cash.type.collection"></option>
              </select>
            </label>
            <label>
              <span data-i18n="cash.amount"></span>
              <input id="cash-operation-amount" type="text" inputmode="decimal" required>
            </label>
            <label id="cash-category-field">
              <span data-i18n="cash.category"></span>
              <input id="cash-operation-category" maxlength="120">
            </label>
            <label>
              <span data-i18n="cash.reason"></span>
              <input id="cash-operation-reason" maxlength="500" required>
            </label>
            <label>
              <span data-i18n="cash.reference"></span>
              <input id="cash-operation-reference" maxlength="200">
            </label>
            <button type="submit" data-i18n="cash.create"></button>
          </form>
          <div class="filter-grid">
            <label><span data-i18n="cash.from"></span><input id="cash-from" type="date"></label>
            <label><span data-i18n="cash.to"></span><input id="cash-to" type="date"></label>
            <button id="cash-refresh" type="button" data-i18n="cash.refresh"></button>
          </div>
          <p><span data-i18n="cash.period_balance"></span>: <strong id="cash-period-balance"></strong></p>
          <h3 data-i18n="cash.noncash"></h3>
          <div class="table-wrap">
            <table><thead id="cash-noncash-head"></thead><tbody id="cash-noncash-body"></tbody></table>
          </div>
          <h3 data-i18n="cash.history"></h3>
          <div class="table-wrap">
            <table><thead id="cash-entries-head"></thead><tbody id="cash-entries-body"></tbody></table>
          </div>
          <div class="pagination-controls">
            <button id="cash-previous" type="button" data-i18n="movements.previous"></button>
            <button id="cash-next" type="button" data-i18n="movements.next"></button>
          </div>
        </section>
        <section id="reports-page" class="page" hidden>
          <h2 data-i18n="reports.title"></h2>
          <form id="reports-form" class="filter-grid">
            <label><span data-i18n="reports.type"></span><select id="report-type"></select></label>
            <label data-report-filter="from"><span data-i18n="reports.from"></span><input id="report-from" type="date"></label>
            <label data-report-filter="to"><span data-i18n="reports.to"></span><input id="report-to" type="date"></label>
            <label data-report-filter="warehouseId"><span data-i18n="reports.warehouse"></span><select id="report-warehouse"></select></label>
            <label data-report-filter="productId"><span data-i18n="reports.product"></span><select id="report-product"></select></label>
            <label data-report-filter="userId"><span data-i18n="reports.cashier"></span><select id="report-user"></select></label>
            <button type="submit" data-i18n="reports.run"></button>
            <button id="report-export" type="button" data-i18n="reports.export" disabled></button>
          </form>
          <p id="reports-summary" role="status" aria-live="polite"></p>
          <div class="table-wrap">
            <table><thead id="reports-head"></thead><tbody id="reports-body"></tbody></table>
          </div>
          <section id="backup-controls" hidden>
            <h3 data-i18n="backup.title"></h3>
            <p data-i18n="backup.description"></p>
            <button id="backup-create" type="button" data-i18n="backup.create"></button>
            <p id="backup-directory-status" role="status" aria-live="polite"></p>
            <p id="backup-status" role="status" aria-live="polite"></p>
            <div class="table-wrap">
              <table><thead id="backup-head"></thead><tbody id="backup-body"></tbody></table>
            </div>
          </section>
        </section>
        <section id="products-page" class="page" hidden>
          <h2 data-i18n="products.title"></h2>
          <form id="product-form" class="form-grid">
            <label><span data-i18n="products.sku"></span><input name="sku" required></label>
            <label><span data-i18n="products.name"></span><input name="name" required></label>
            <label>
              <span data-i18n="products.unit"></span>
              <select id="product-unit-select" name="unit" required></select>
            </label>
            <label id="custom-unit-field" hidden>
              <span data-i18n="products.custom_unit"></span>
              <input name="custom_unit" maxlength="32">
            </label>
            <label><span data-i18n="products.base_price"></span><input name="base_price" type="number" min="0" step="1" required></label>
            <button type="submit" data-i18n="products.create"></button>
          </form>
          <section id="product-import-panel" class="product-import-panel" hidden>
            <h3 data-i18n="product_import.title"></h3>
            <p data-i18n="product_import.description"></p>
            <a id="product-import-template" class="button-link" href="/api/products/import/template" data-i18n="product_import.template"></a>
            <form id="product-import-form" class="form-grid">
              <label>
                <span data-i18n="product_import.csv_file"></span>
                <input id="product-import-file" type="file" accept=".csv,text/csv" required>
              </label>
              <label>
                <span data-i18n="product_import.mode"></span>
                <select id="product-import-mode">
                  <option value="skip" data-i18n="product_import.mode_skip"></option>
                  <option value="update" data-i18n="product_import.mode_update"></option>
                </select>
              </label>
              <label class="product-import-checkbox">
                <input id="product-import-create-categories" type="checkbox">
                <span data-i18n="product_import.create_categories"></span>
              </label>
              <button type="submit" data-i18n="product_import.preview"></button>
            </form>
            <div id="product-import-preview" hidden>
              <p id="product-import-summary" role="status" aria-live="polite"></p>
              <p id="product-import-categories" role="status" aria-live="polite" hidden></p>
              <div class="table-wrap">
                <table><thead id="product-import-head"></thead><tbody id="product-import-body"></tbody></table>
              </div>
              <div class="product-import-actions">
                <button id="product-import-commit" type="button" data-i18n="product_import.commit" disabled></button>
                <button id="product-import-download" type="button" class="button-secondary" data-i18n="product_import.download_report" hidden></button>
              </div>
              <p id="product-import-outcome" role="status" aria-live="polite"></p>
            </div>
          </section>
          <div class="table-wrap"><table><thead id="products-head"></thead><tbody id="products-body"></tbody></table></div>
        </section>
        <section id="stock-page" class="page" hidden>
          <h2 data-i18n="stock.title"></h2>
          <label><span data-i18n="stock.warehouse"></span><select id="stock-warehouse-filter"></select></label>
          <div class="table-wrap"><table><thead id="stock-head"></thead><tbody id="stock-body"></tbody></table></div>
        </section>
        <section id="returns-page" class="page" hidden>
          <h2 data-i18n="returns.title"></h2>
          <form id="return-search-form" class="form-grid">
            <label><span data-i18n="returns.search"></span><input id="return-search" required></label>
            <button type="submit" data-i18n="returns.find"></button>
          </form>
          <div id="return-search-results"></div>
          <form id="return-form" hidden>
            <h3 id="return-sale-title"></h3>
            <div id="return-lines" class="purchase-lines"></div>
            <p id="return-quote" role="status"></p>
            <label><span data-i18n="returns.reason"></span><input id="return-reason" maxlength="1000" required></label>
            <label><span data-i18n="returns.payment_method"></span><select id="return-payment-method"></select></label>
            <label><span data-i18n="returns.receipt_language"></span>
              <select id="return-receipt-language"><option value="ru">RU</option><option value="uz">UZ</option></select>
            </label>
            <button type="submit" data-i18n="returns.submit"></button>
          </form>
        </section>
        <section id="writeoffs-page" class="page" hidden>
          <h2 data-i18n="writeoff.title"></h2>
          <form id="writeoff-form" class="form-grid">
            <label><span data-i18n="purchases.warehouse"></span><select id="writeoff-warehouse" required></select></label>
            <label><span data-i18n="purchases.product"></span><select id="writeoff-product" required></select></label>
            <label><span data-i18n="purchases.qty"></span><input id="writeoff-qty" type="number" min="0.001" step="0.001" required></label>
            <label><span data-i18n="writeoff.reason"></span>
              <select id="writeoff-reason" required>
                <option value="damaged" data-i18n="writeoff.damaged"></option>
                <option value="lost" data-i18n="writeoff.lost"></option>
                <option value="expired" data-i18n="writeoff.expired"></option>
                <option value="other" data-i18n="writeoff.other"></option>
              </select>
            </label>
            <label><span data-i18n="purchases.note"></span><input id="writeoff-note" maxlength="1000"></label>
            <button type="submit" data-i18n="writeoff.submit"></button>
          </form>
          <div class="table-wrap"><table><thead id="writeoffs-head"></thead><tbody id="writeoffs-body"></tbody></table></div>
        </section>
        <section id="stocktakes-page" class="page" hidden>
          <h2 data-i18n="stocktake.title"></h2>
          <form id="stocktake-start-form" class="form-grid">
            <label><span data-i18n="purchases.warehouse"></span><select id="stocktake-warehouse" required></select></label>
            <label><span data-i18n="stocktake.mode"></span>
              <select id="stocktake-mode">
                <option value="all" data-i18n="stocktake.all"></option>
                <option value="selected" data-i18n="stocktake.selected"></option>
              </select>
            </label>
            <label id="stocktake-products-field" hidden><span data-i18n="stocktake.products"></span>
              <select id="stocktake-products" multiple size="8"></select>
            </label>
            <label><span data-i18n="purchases.note"></span><input id="stocktake-note" maxlength="1000"></label>
            <button type="submit" data-i18n="stocktake.start"></button>
          </form>
          <div id="stocktake-list"></div>
          <section id="stocktake-detail" hidden>
            <h3 id="stocktake-detail-title"></h3>
            <p id="stocktake-reserve-warning" role="status"></p>
            <div id="stocktake-lines" class="purchase-lines"></div>
            <div id="stocktake-reservations" class="purchase-lines"></div>
            <button id="stocktake-save" type="button" data-i18n="stocktake.save"></button>
            <button id="stocktake-complete" type="button" data-i18n="stocktake.complete"></button>
            <button id="stocktake-cancel" type="button" data-i18n="stocktake.cancel"></button>
          </section>
        </section>
        <section id="purchases-page" class="page" hidden>
          <h2 data-i18n="purchases.title"></h2>
          <form id="purchase-form">
            <label><span data-i18n="purchases.warehouse"></span><select name="warehouseId" id="purchase-warehouse" required></select></label>
            <label><span data-i18n="purchases.date"></span><input name="date" type="date" required></label>
            <label><span data-i18n="purchases.supplier"></span><input name="supplier" maxlength="200"></label>
            <section id="purchase-import-panel" class="product-import-panel" hidden>
              <h3 data-i18n="purchase_import.title"></h3>
              <p data-i18n="purchase_import.description"></p>
              <a id="purchase-import-template" class="button-link" href="/api/purchases/import/template" data-i18n="purchase_import.template"></a>
              <div class="form-grid">
                <label>
                  <span data-i18n="purchase_import.category"></span>
                  <select id="purchase-import-category"></select>
                </label>
                <a id="purchase-import-products-template" class="button-link" href="/api/purchases/import/products-template" data-i18n="purchase_import.products_template"></a>
              </div>
              <div class="form-grid">
                <label>
                  <span data-i18n="purchase_import.csv_file"></span>
                  <input id="purchase-import-file" type="file" accept=".csv,text/csv">
                </label>
                <button id="purchase-import-preview-button" type="button" data-i18n="purchase_import.preview"></button>
              </div>
              <label id="purchase-import-update-price-field" class="product-import-checkbox">
                <input id="purchase-import-update-price" type="checkbox">
                <span data-i18n="purchase_import.update_sale_price"></span>
              </label>
              <div id="purchase-import-preview" hidden>
                <p id="purchase-import-summary" role="status" aria-live="polite"></p>
                <div class="table-wrap">
                  <table><thead id="purchase-import-head"></thead><tbody id="purchase-import-body"></tbody></table>
                </div>
                <div class="product-import-actions">
                  <button id="purchase-import-apply" type="button" data-i18n="purchase_import.apply" disabled></button>
                </div>
                <p id="purchase-import-outcome" role="status" aria-live="polite"></p>
              </div>
            </section>
            <div>
              <h3 data-i18n="purchases.lines"></h3>
              <div id="purchase-lines" class="purchase-lines"></div>
              <button id="add-purchase-line" type="button" data-i18n="purchases.add_line"></button>
            </div>
            <label><span data-i18n="purchases.note"></span><input name="note" maxlength="1000"></label>
            <button type="submit" data-i18n="purchases.submit"></button>
          </form>
          <h3 data-i18n="purchases.history"></h3>
          <div class="table-wrap"><table><thead id="purchases-head"></thead><tbody id="purchases-body"></tbody></table></div>
          <section id="purchase-detail" hidden>
            <h3 id="purchase-detail-title"></h3>
            <div class="table-wrap"><table><thead id="purchase-detail-head"></thead><tbody id="purchase-detail-body"></tbody></table></div>
          </section>
        </section>
        <section id="movements-page" class="page" hidden>
          <h2 data-i18n="movements.title"></h2>
          <div class="filter-grid">
            <label><span data-i18n="movements.product"></span><select id="movement-product-filter"></select></label>
            <label><span data-i18n="movements.warehouse"></span><select id="movement-warehouse-filter"></select></label>
            <button id="refresh-movements" type="button" data-i18n="movements.refresh"></button>
          </div>
          <div class="table-wrap"><table><thead id="movements-head"></thead><tbody id="movements-body"></tbody></table></div>
          <div class="pagination-controls">
            <button id="movements-previous" type="button" data-i18n="movements.previous"></button>
            <button id="movements-next" type="button" data-i18n="movements.next"></button>
          </div>
        </section>
        <section id="users-page" class="page" hidden>
          <h2 data-i18n="users.title"></h2>
          <form id="user-form" class="form-grid">
            <label><span data-i18n="users.login"></span><input name="login" autocomplete="off" required></label>
            <label><span data-i18n="users.full_name"></span><input name="fullName" required></label>
            <label><span data-i18n="users.password"></span><input name="password" type="password" autocomplete="new-password" minlength="5" required></label>
            <label><span data-i18n="users.role"></span><select name="role"><option value="cashier" data-i18n="users.cashier"></option><option value="admin" data-i18n="users.admin"></option></select></label>
            <label><span data-i18n="users.language"></span><select name="lang"><option value="ru">RU</option><option value="uz">UZ</option></select></label>
            <button type="submit" data-i18n="users.create"></button>
          </form>
          <div class="table-wrap"><table><thead id="users-head"></thead><tbody id="users-body"></tbody></table></div>
          <form id="user-edit-form" class="form-grid" hidden>
            <h3 data-i18n="users.edit"></h3>
            <label><span data-i18n="users.full_name"></span><input name="fullName" required></label>
            <label><span data-i18n="users.role"></span><select name="role"><option value="cashier" data-i18n="users.cashier"></option><option value="admin" data-i18n="users.admin"></option></select></label>
            <label><span data-i18n="users.language"></span><select name="lang"><option value="ru">RU</option><option value="uz">UZ</option></select></label>
            <label class="permission-item"><input name="active" type="checkbox"><span data-i18n="users.active"></span></label>
            <label><span data-i18n="users.new_password"></span><input name="password" type="password" autocomplete="new-password" minlength="5"></label>
            <button type="submit" data-i18n="users.save_user"></button>
          </form>
          <section id="permission-editor" hidden>
            <h3 data-i18n="users.permissions"></h3>
            <p id="permission-user"></p>
            <div id="permission-list" class="permission-grid"></div>
            <h4 data-i18n="users.pages"></h4>
            <p data-i18n="users.pages_help"></p>
            <div id="page-permission-list" class="permission-grid"></div>
            <fieldset id="sales-warehouse-permission">
              <legend data-i18n="users.sales_warehouses"></legend>
              <p data-i18n="users.sales_warehouses_help"></p>
              <div id="sales-warehouse-permission-list" class="permission-grid"></div>
            </fieldset>
            <button id="save-permissions" type="button" data-i18n="users.save_permissions"></button>
          </section>
        </section>
        <section id="connection-page" class="page" hidden>
          <h2 data-i18n="connection.title"></h2>
          <p data-i18n="connection.description"></p>
          <button id="refresh-connection-info" type="button" data-i18n="connection.refresh"></button>
          <p id="connection-warning" role="status" aria-live="polite"></p>
          <div id="connection-addresses"></div>
        </section>
        <section id="warehouses-page" class="page" hidden>
          <h2 data-i18n="warehouses.title"></h2>
          <form id="warehouse-form" class="form-grid">
            <label>
              <span data-i18n="warehouses.name"></span>
              <input name="name" maxlength="120" required>
            </label>
            <button id="warehouse-submit" type="submit" data-i18n="warehouses.create"></button>
            <button id="warehouse-cancel-edit" class="button-secondary" type="button" data-i18n="common.cancel" hidden></button>
          </form>
          <div class="table-wrap">
            <table><thead id="warehouses-head"></thead><tbody id="warehouses-body"></tbody></table>
          </div>
        </section>
      </section>
    </main>
    <dialog id="price-dialog" class="modal-dialog">
      <form id="price-form">
        <h2 data-i18n="products.price_dialog_title"></h2>
        <p id="price-product-name"></p>
        <label>
          <span data-i18n="products.base_price"></span>
          <input id="price-value" name="base_price" type="number" min="0" step="1" required>
        </label>
        <div class="dialog-actions">
          <button id="price-cancel" type="button" class="button-secondary" data-i18n="common.cancel"></button>
          <button type="submit" data-i18n="products.save_price"></button>
        </div>
      </form>
    </dialog>
    <dialog id="customer-dialog" class="modal-dialog">
      <form id="customer-form">
        <h2 data-i18n="customers.add_title"></h2>
        <label><span data-i18n="customers.name"></span><input name="name" maxlength="120" required></label>
        <label><span data-i18n="customers.phone"></span><input name="phone" maxlength="200"></label>
        <label><span data-i18n="customers.note"></span><input name="note" maxlength="1000"></label>
        <div class="dialog-actions">
          <button id="customer-cancel" type="button" class="button-secondary" data-i18n="common.cancel"></button>
          <button type="submit" data-i18n="customers.save"></button>
        </div>
      </form>
    </dialog>
    <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  </body>
</html>
